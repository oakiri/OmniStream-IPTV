name: omnistream_iptv
description: "OmniStream IPTV - Cross-platform IPTV player with high-performance streaming, EPG support, and adaptive UI for mobile and TV devices."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Reactive Programming
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  hooks_riverpod: ^2.4.0
  
  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.0
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.0
  connectivity_plus: ^5.0.0
  
  # Video Player & Media
  video_player: ^2.7.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.0.6  # REQUIRED: Native libmpv.so for Android
  # media_kit_libs_linux: ^1.2.0  # Disabled for Android build
  # media_kit_libs_macos: ^1.2.0  # Disabled for Android build
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0
  firebase_remote_config: ^4.3.0
  
  # UI & Navigation
  go_router: ^12.0.0
  flutter_bloc: ^8.1.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  
  # Logging & Debugging
  logger: ^2.0.0
  
  # Performance & Optimization
  get_it: ^7.6.0
  dartz: ^0.10.1
  
  # XML Parsing (for EPG/XMLTV)
  xml: ^6.3.0
  
  # String Matching (Fuzzy matching for EPG)
  string_similarity: ^2.1.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  flutter_focus_watcher: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  hive_generator: ^2.0.0
  drift_dev: ^2.13.0
  
  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
