name: omnistream_iptv
description: "OmniStream IPTV - Cross-platform IPTV player with high-performance streaming, EPG support, and adaptive UI for mobile and TV devices."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  hooks_riverpod: ^2.4.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking
  http: ^1.1.0
  dio: ^5.3.0
  connectivity_plus: ^5.0.0
  
  # Video Player
  video_player: ^2.7.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.0.6
  
  # Environment & Firebase
  flutter_dotenv: ^5.1.0
  firebase_core: ^2.24.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.5.7
  firebase_remote_config: ^4.3.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_performance: ^0.9.4+7
  
  # UI & Navigation
  go_router: ^12.0.0
  flutter_bloc: ^8.1.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^7.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  flutter_focus_watcher: ^2.0.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  logger: ^2.0.0
  get_it: ^7.6.0
  dartz: ^0.10.1
  xml: ^6.3.0
  string_similarity: ^2.1.0
  internet_connection_checker: ^1.0.0+1
  media_kit_libs_video: ^1.0.7
  volume_controller: ^3.4.1
  screen_brightness: ^2.1.7
  battery_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  hive_generator: ^2.0.0
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env