  flutter_dotenv: ^5.1.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  
  # --- Plugins de Hardware (Versiones Corregidas) ---
  wakelock_plus: ^1.2.8
